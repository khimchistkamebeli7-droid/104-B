# Шаг 6 руководства: автокорреляция минутных доходностей на реальных данных Deriv.
name: Microstructure audit — автокорреляция 1m

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Инструменты через запятую'
        default: 'EURUSD,USDJPY,BTCUSDT,ETHUSDT'
      from:
        description: 'С даты (ГГГГ-ММ-ДД)'
        default: '2026-03-01'
      to:
        description: 'По дату (ГГГГ-ММ-ДД)'
        default: '2026-09-17'

permissions:
  contents: read

jobs:
  microstructure:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # НЕ 20: нужен глобальный WebSocket
          cache: npm
      - run: npm ci

      - name: Прогон microstructure-audit
        run: |
          npm run backtest:microstructure-audit -- \
            --symbols="${{ inputs.symbols }}" \
            --from="${{ inputs.from }}" --to="${{ inputs.to }}"

      - name: Показать отчёт на странице запуска
        if: success()
        run: cat backtest/output/microstructure-audit-*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microstructure-output
          path: backtest/output/microstructure-audit-*.md
          if-no-files-found: warn
          retention-days: 30
